# Layout smoke check (BRO-2027). Turns the portfolio acceptance criterion
# "no horizontal scroll at 375px" into something CI enforces on every PR,
# instead of something a reviewer has to remember to eyeball.
name: Layout check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # astro 7 requires Node >=22.12.0 — matches deploy.yml (BRO-910/BRO-854)
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Serve the built site and check every route
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/ > /dev/null && break
            sleep 1
          done
          # `astro preview --port` falls back to the next free port instead of
          # failing when 4321 is taken, so a stray listener makes the check run
          # against someone else's server — which reports every route as a 404
          # and reads like a real layout regression (BRO-1657 category
          # safeguard). Confirm the server on 4321 is actually this build
          # before trusting anything it says.
          if ! curl -sf http://localhost:4321/archive/ | grep -q 'Eric Brookfield'; then
            echo "::error::Nothing recognisable as this site is serving on :4321 —"
            echo "::error::the preview server failed to start or fell back to another port."
            exit 1
          fi
          npm run check:layout -- http://localhost:4321
