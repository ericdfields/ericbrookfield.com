# merge-on-approval — the last-mile step that turns "CI green + approved"
# into an actual merge, with no human clicking through the GitHub merge button.
#
# ⚠️ GENERATED FILE — DO NOT EDIT IN PLACE. ⚠️
# Source of truth: ericdfields/brookfield-digital-os
#   scripts/merge-gate/workflow.template.yml  (this workflow)
#   .github/scripts/merge-decision.js         (the decision core, inlined below)
#   scripts/merge-gate/repos.json             (per-repo required checks)
# Regenerate with `node scripts/merge-gate/build.mjs`; `audit.mjs` fails if any
# installed copy drifts from what the template renders. Edit the template, not
# the copy — a hand-edit here is reverted by the next sync and, worse, is
# invisible to the audit until then.
#
# Why vendored into every repo instead of a cross-repo reusable `uses:`
# (BRO-2024): `brookfield-digital-os` is PRIVATE and several target repos
# (ericbrookfield.com, brkdllc.com) are PUBLIC. A public repo cannot call a
# reusable workflow out of a private one, and the failure is a workflow that
# never runs — the exact silent-inertness this file exists to fix. Vendoring
# has no cross-repo runtime dependency and follows the precedent already set by
# verified-done.yml.
#
# Why this exists (BRO-1694 / BRO-1695): the fleet's definition of "done" ended
# at `gh pr create`. CI went green, the authoring session ended, and merge state
# lived only in GitHub — which no fleet component read back from. 15 PRs rotted;
# 6 of them decayed into merge conflicts. Diagnosis confirmed two structural
# walls: (1) every PR is authored by `ericdfields`, the same account Eric would
# review with, so GitHub hard-blocks self-approval and no `pull_request_review`
# mechanism can ever fire; (2) private user repos can't use branch protection /
# CODEOWNERS / native auto-merge without a paid plan.
#
# The one approval primitive Eric CAN emit on his own PR is a LABEL. So the
# contract is: applying the `founder-approved` label == "merge this, no question"
# (Eric's standing policy). This workflow is the deterministic executor of that
# policy — no LLM in the merge path, runs on GitHub infra (survives laptop sleep
# and agent outages).
#
# BRO-1842 added a SECOND arming label, `review-passed`. On that issue a PR sat
# green, twice-approved, and MERGEABLE/CLEAN for two hours because the rules gave
# agents no way to finish. `review-passed` is the CEO's label, applied on final
# review-gate approval when the Merge Gate Rubric (CONTRIBUTING.md) clears the
# change. `founder-approved` is unchanged and still Founder-only. Either arms the
# merge; the merge comment records WHICH, permanently.
#
# The merge gates on THREE conditions, all required:
#   1. an arming label is present (`founder-approved` OR `review-passed`), AND
#   2. every check in REQUIRED_CHECKS is a completed success on the head commit, AND
#   3. the PR is mergeable (no conflicts).
#
# The decision itself lives in .github/scripts/merge-decision.js in the source
# repo — a pure, unit-tested module, inlined verbatim below by the generator. A
# test asserts the inlined copy still decides identically to the module, so the
# one piece that can silently deadlock every merge in the repo is covered by
# tests rather than buried in this YAML.
#
# On a new push after approval (`synchronize`) the label is stripped, forcing
# re-approval of the new code. A scheduled sweep is the backstop: it re-checks
# every labeled-but-not-yet-merged PR (e.g. one labeled while CI was still
# running) and emits a digest to the run summary.
#
# WHY `workflow_run` (BRO-2426): the ordinary ordering is that the label is
# applied while CI is still running, so the `labeled` run above correctly
# returns `wait-checks` — and until this trigger existed, NOTHING re-evaluated
# the PR when the last check finished. No event fires on check completion, so
# the PR waited for the next cron tick: up to 30 minutes of silence, which is
# indistinguishable from the BRO-1694/1695 rot this workflow exists to end.
# (argus #384: `wait-checks` at 02:15:40Z, `test` green at 02:18:44Z, nothing
# re-ran, Eric merged by hand at 02:31:12Z.)
#
# WHY NOT `check_suite: [completed]`, which is the obvious answer and does not
# work: "To prevent recursive workflows, this event does not trigger workflows
# if the check suite was created by GitHub Actions or if the check suite's head
# SHA is associated with GitHub Actions" (GitHub's words). EVERY required check
# in repos.json is a GitHub Actions job — registry rule 1 says so explicitly,
# because `checks.listForRef` cannot see anything else. Verified against the
# live API before writing this: every check suite on `argus@main` reports
# `app.slug == "github-actions"`. So a `check_suite` trigger here would parse,
# install, audit clean, and fire exactly never — an inert trigger, which is a
# strictly worse failure than the latency it was meant to fix. Do not "simplify"
# this to `check_suite`; a test in sweep.test.mjs fails the fleet if you do.
#
# `workflow_run` fires on the completion of a NAMED workflow, so it needs the
# per-repo `ciWorkflows` registry field — the cost `check_suite` appeared to
# avoid. It buys the recursion argument outright: this workflow's own name is
# never in that list, so a merge-on-approval run cannot re-trigger merge-on-
# approval, and the chain terminates by construction rather than by relying on
# GitHub's three-level cap. audit.mjs checks each registered name against the
# live repo, so a renamed or deleted CI workflow is reported rather than
# silently degrading back to cron-only.
#
# It is an ACCELERATOR, not a replacement. The `*/30` cron stays: `workflow_run`
# only fires for workflows named in the registry, only once this file is on the
# default branch, and a repo with no PR CI at all has no trigger to hang it on.
#
# POST-MERGE DISPATCH (BRO-2059): GitHub deliberately refuses to let a push made
# with the default `GITHUB_TOKEN` trigger further `push` / `pull_request`
# workflows — an anti-recursion guard. So this workflow merging a PR is NOT the
# same event as a human merging it: the commit lands on the base branch and any
# `on: push` Deploy workflow never runs. Production keeps serving the pre-merge
# build, and nothing anywhere reports a failure, because nothing failed. On
# `argus` that hid two shipped PRs for ~35h; the same silent gap existed in every
# repo that pairs this gate with a push-triggered deploy.
#
# An EXPLICIT API dispatch is exempt from the guard, so the fix is to ask for the
# run by name instead of hoping for a cascade. POST_MERGE_DISPATCH maps each base
# branch to the workflow files to re-dispatch on it after a successful merge.
# Every listed workflow must declare `workflow_dispatch:` on that branch or the
# dispatch 422s — `scripts/merge-gate/audit.mjs` checks that pairing against the
# real repos, so the mistake fails in CI rather than in production.
#
# WHY `pull_request_target` AND NOT `pull_request` (BRO-2244): for `pull_request`,
# GitHub resolves the workflow file to run from the PR's HEAD branch. A gate
# installed on `main` today therefore does not exist on any PR branch cut before
# today, and on those PRs `labeled` fires NOTHING — the Founder applies the label
# and the only thing that ever notices is the 30-minute sweep. Worse, the
# `synchronize` half is inert too, so a push after approval never strips the
# label and the sweep can merge code that was approved in an earlier state. That
# was 37 of 62 open PRs across the fleet when it was found (leadrrr#28: label at
# 18:56:11Z, zero runs, merged only via a manual dispatch 8 minutes later).
#
# `pull_request_target` instead "runs in the context of the default branch of the
# base repository" (GitHub's words). Note DEFAULT branch, not the PR's base
# branch — verified the hard way: a proof PR based on a scratch branch carrying
# this file fired nothing, because GitHub had only ever read `main`. That is the
# semantics this gate actually wants, and slightly stronger than base-resolution
# would be: whether a repo merges on a label is repo policy, and no PR opts out
# of it by being old. It also means one merge to `main` arms every open PR at
# once, including PRs based on `staging` — those now run `main`'s copy of the
# gate, so POST_MERGE_DISPATCH must keep an entry for every base branch in use
# (it is keyed by base ref, and audit.mjs checks the pairing).
#
# The standard objection to `pull_request_target` is that it runs with a
# read/write token against untrusted PR code. That cannot happen here: this
# workflow has NO `actions/checkout` step and never executes anything from the
# PR. The decision core is inlined into this file (i.e. read from the base
# branch) and reaches the PR only through `github-script` API reads, where PR
# text is JS data and never shell/`${{ }}` interpolation. Do not "fix" this back
# to `pull_request` — `audit.mjs` fails the fleet if you do.
#
# SECURITY / AUDIT: because agents and Eric share the `ericdfields` account, an
# agent is technically capable of applying this label. That is PROHIBITED
# (see CONTRIBUTING.md, The Two Merge Labels). Every merge is commented with the labeling actor + timestamp
# so misuse is auditable after the fact.
#
# merge-gate-repo: ericdfields/ericbrookfield.com
# merge-gate-version: 36598a46ea8d

name: merge-on-approval

on:
  # `_target`, not `pull_request` — resolves this file from the repo's DEFAULT
  # branch, so the gate applies to PRs older than its own install (BRO-2244).
  pull_request_target:
    types: [labeled, synchronize]
  # BRO-2426. The accelerator: without this, a PR labeled while CI was still
  # running waits for the cron below, because no event fires on check completion.
  # These are workflow `name:` values, not filenames, and never include this
  # workflow — which is what makes the trigger non-recursive by construction.
  workflow_run:
    workflows: ["Layout check", "Audit"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *" # backstop sweep for PRs labeled while CI was still running
  workflow_dispatch: # manual kick, useful for testing the sweep path

permissions:
  contents: write # merge + delete branch
  pull-requests: write # merge, comment, manage labels
  issues: write # label management goes through the issues API
  checks: read # read the required-check conclusions
  actions: write # re-dispatch the post-merge workflows a bot merge can't cascade to

concurrency:
  # One in-flight run per PR on the event path; ONE shared lane for every sweep.
  #
  # BRO-2426: the sweep key used to be `github.run_id`, which is unique per run
  # — i.e. no serialisation at all. That was harmless while the only sweeps were
  # 30 minutes apart, and stops being harmless now that a finishing CI workflow
  # starts one: several can complete within seconds of each other and each would
  # run its own concurrent `pulls.list` + merge pass over the same PRs. Two runs
  # racing the same PR is not idempotent — one wins `pulls.merge` and the other
  # takes a 405 into the `errored` row, failing a run over a PR that merged fine.
  #
  # A shared group makes GitHub do the collapsing: with a run in progress, a
  # newly-queued run becomes pending AND CANCELS whatever was already pending.
  # So a burst of N sweeps costs at most 2 — the one running, plus the last one
  # queued, which re-evaluates every PR from scratch and is therefore the only
  # one whose result matters. Discarding the middle of a burst loses nothing.
  #
  # `cancel-in-progress` stays false, deliberately: cancelling a sweep mid-merge
  # could land `pulls.merge` and never reach the post-merge dispatch, which is
  # the BRO-2059 silent-no-deploy failure manufactured on purpose.
  group: merge-on-approval-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'sweep' }}
  cancel-in-progress: false

jobs:
  merge:
    # `pull_request_target` runs privileged, in the base repo's context, even for
    # PRs opened from forks — and two of the repos this template installs into
    # are PUBLIC, so an outside contributor can trigger it. This workflow runs
    # nothing from the PR, so that is not a code-execution path, but there is no
    # reason to hand a write token to a run a stranger can start. Fork PRs
    # therefore skip the event path entirely.
    #
    # Nothing is lost by it: the scheduled sweep runs on the default branch with
    # the same permissions and picks up ANY labeled PR, fork included. A fork PR
    # is merged by the sweep instead of on the label, which is exactly what
    # happened before this trigger existed.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout: the decision core is inlined below so this workflow is a
      # single self-contained file that can be dropped into any repo.
      # BRO-2499. v9 runs on node24, which is the default on the self-hosted
      # [self-hosted, macOS, ARM64] pool (runner 2.336.0, externals/node24 =
      # v24.18.0, usenode24bydefault=true) and on GitHub-hosted runners alike.
      # Carried in this PR rather than its own because every byte of this
      # template feeds versionOf() — bumping it alone would cost a second
      # seven-repo distribution round for one line.
      - uses: actions/github-script@v9
        with:
          script: |
            // ---- BEGIN inlined .github/scripts/merge-decision.js ----------------
            // Pure decision core for merge-on-approval. No network, no Octokit, no clock —
            // every input is passed in so the whole thing is unit-testable.
            //
            // THIS FILE IS THE SOURCE OF TRUTH for every repo's merge gate (BRO-2024).
            // scripts/merge-gate/build.mjs inlines it verbatim into the workflow it renders
            // for each repo in scripts/merge-gate/repos.json, so a change here reaches all
            // of them — but only once they are regenerated and the PRs land. After editing:
            //   node --test .github/scripts/merge-decision.test.js   # still correct?
            //   node scripts/merge-gate/build.mjs --write-self       # refresh this repo
            //   node scripts/merge-gate/audit.mjs                    # who has drifted?
            // Manual mirroring is no longer a thing; an earlier revision of this comment
            // asked for a hand-copy into ericdfields/argus, and that is what the generator
            // replaces.

            /**
             * Conclusions that mean "this check produced no verdict", as distinct from
             * "this check said no" (BRO-2370). A run killed mid-flight — the machine went
             * away, the queue was drained, a newer push superseded it — reports as a red X
             * in the GitHub UI and in the checks API alike, but nothing was actually
             * evaluated. Treating it as a failure told the Founder a docs-only PR had
             * failed `mcp-build`, which is not a thing that can happen. These need a
             * re-run, not a fix.
             */
            const NO_VERDICT = new Set(["cancelled", "stale"]);

            /**
             * Resolve what every check run reporting under one required name collectively
             * says (BRO-2199).
             *
             * This used to pick a single run — the newest `started_at` — on the theory that
             * "GitHub appends a new check run per re-run attempt, so the first match may be
             * a stale failure a passing re-run has superseded". That theory is false, and
             * the code built on it decided merges by a race.
             *
             * What is actually true, verified against the live API rather than recalled:
             *
             *   1. `checks.listForRef` defaults to `filter=latest`, and a re-run reports
             *      into the SAME check suite, replacing its predecessor there. On
             *      flora-stora run 32572005410 (attempt 1 `cancelled`, attempt 2 `success`,
             *      one suite 88285379100) the default filter returns 13 runs and only
             *      attempt 2's `npm audit (high)`; `filter=all` returns 15 and both. So
             *      re-run supersession is done FOR us, upstream, before this code runs.
             *      The workflow now pins `filter: 'latest'` explicitly rather than leaning
             *      on a default, because this function's correctness depends on it.
             *
             *   2. Therefore anything still sharing a name here is not a re-run of one
             *      assertion — it is a DIFFERENT check suite. Two ways that happens, both
             *      observed in this fleet:
             *
             *        a. TWO TRIGGERS. bd-os's `verified-done.yml` fired on both
             *           `push: ["**"]` and `pull_request`; on commit dc39b9e9 that produced
             *           `verified-done gate` twice, suite 86709733094 (push, 00:15:00,
             *           FAILURE) and suite 86709812811 (PR, 00:15:37, success). The old
             *           reduce kept the green one because it started 37 seconds later and
             *           the merge went through. Reverse the ordering — a scheduling
             *           coincidence — and it would have refused a PR whose own tests all
             *           passed. That particular duplicate is now gone at the source (its
             *           push trigger is `branches: [main]`), but the shape is not: jlnk's
             *           ci.yml still produces it on 14 of its last 15 PRs, and this core
             *           ships to seven repos whose triggers it does not control.
             *
             *        b. TWO PULL REQUESTS ON ONE COMMIT. Stacked or split branches can
             *           share a head SHA, and each PR gets its own suite — argus e93218c3
             *           carried all six required names twice, both `pull_request`, both
             *           attempt 1, from branches BRO-2481 and BRO-2320. `listForRef` is
             *           keyed by commit, not by PR, so both come back. These can disagree
             *           if the PRs have different bases, since a `pull_request` run tests
             *           the merge commit.
             *
             *      There is no way to attribute a run to one PR from this payload: GitHub
             *      returns `pull_requests: []` on every check run in these repos (verified
             *      on both bd-os and argus — they are private, and the field is only
             *      populated for the repo that owns the PR in ways this org does not get).
             *      So case (b) is handled the same way as (a) — every verdict counts — and
             *      `splitChecks` exists to tell the approver a name reported more than once
             *      rather than leaving them to wonder why their green PR is blocked.
             *
             * So: a red is never discarded. Every verdict rendered under a required name
             * has to be green. The rules, in precedence order:
             *
             *   failed    — any run reached a real non-success conclusion. Final: no
             *               sibling can un-fail it, so this beats a still-running sibling.
             *   pending   — no red, but something has not reported yet.
             *   success   — at least one affirmative green verdict, and no red. A sibling
             *               that was cancelled is silence (BRO-2370), not dissent, so it
             *               does not veto a green that did render a verdict.
             *   cancelled — runs exist but every one of them is a no-verdict.
             *   missing   — no run at all.
             *
             * `started_at` is deliberately not read. The old `Date.parse(c.started_at || 0)`
             * also yielded NaN on a run missing the field, and every `NaN >= NaN` is false,
             * so such a run silently lost the reduce regardless of ordering. Nothing here
             * consults a clock any more, so that bug is gone rather than patched.
             */
            function resolveCheck(checkRuns, name) {
              const runs = checkRuns.filter((c) => c.name === name);
              if (runs.length === 0) return { state: "missing", runs, failed: [] };

              const completed = runs.filter((c) => c.status === "completed");
              const failed = completed.filter(
                (c) => !NO_VERDICT.has(c.conclusion) && c.conclusion !== "success",
              );

              if (failed.length) return { state: "failed", runs, failed };
              if (completed.length < runs.length) return { state: "pending", runs, failed };
              if (completed.some((c) => c.conclusion === "success")) {
                return { state: "success", runs, failed };
              }
              return { state: "cancelled", runs, failed };
            }

            function decideMerge(input) {
              const {
                merged, state, draft, mergeable, labels, checkRuns,
                approvalLabels, requiredChecks,
                labelAppliedAtMs, nowMs, stallAfterMs,
              } = input;

              const nothing = {
                armedBy: null, missingChecks: [], failedChecks: [], cancelledChecks: [], splitChecks: [],
              };

              if (merged) return { action: "already-merged", reason: "already merged", ...nothing };
              if (state !== "open") return { action: "closed", reason: `PR is ${state}`, ...nothing };

              const armedBy = approvalLabels.find((l) => labels.includes(l)) || null;
              if (!armedBy) return { action: "no-label", reason: "no arming label", ...nothing };

              /**
               * A draft is the author saying "not ready", and GitHub enforces it: the merge
               * API rejects a draft with 405 "Pull Request is still a draft". Nothing
               * screened for it, so an armed draft threw straight out of `attemptMerge` —
               * the same poison-pill shape as the workflow-scope 403, and the live cause of
               * argus's dead sweep on 2026-08-22 (BRO-2200). The per-PR try/catch from
               * BRO-2370 keeps the sweep alive through it, but the run still goes red every
               * 30 minutes over a PR whose author has done nothing wrong.
               *
               * Arming a draft is legitimate — "merge this once I mark it ready" — so this
               * waits rather than complaining, and deliberately does NOT feed stall
               * detection: a draft may sit as long as its author likes without that being
               * an infrastructure fault.
               */
              if (draft) return { action: "wait-draft", reason: "PR is a draft", ...nothing, armedBy };

              const missingChecks = [];
              const failedChecks = [];
              const cancelledChecks = [];
              /**
               * Required names that reported more than once on this commit. This is the
               * BRO-2024 half of BRO-2199: the approver sees one red check called
               * `verified-done gate` and has no way to tell it came from a full-repo push
               * run rather than from their own diff. Naming the split — and linking the red
               * run specifically — is what makes that visible instead of mysterious.
               */
              const splitChecks = [];
              let pending = 0;

              for (const name of requiredChecks) {
                const c = resolveCheck(checkRuns, name);
                if (c.runs.length > 1) {
                  splitChecks.push({
                    name,
                    total: c.runs.length,
                    failedCount: c.failed.length,
                    failedUrls: c.failed.map((r) => r.details_url).filter(Boolean),
                  });
                }
                if (c.state === "missing") missingChecks.push(name);
                else if (c.state === "pending") pending++;
                else if (c.state === "cancelled") cancelledChecks.push(name);
                else if (c.state === "failed") failedChecks.push(name);
              }

              const common = { armedBy, missingChecks, failedChecks, cancelledChecks, splitChecks };

              // A red check is a normal outcome the author owns — report it and stop.
              if (failedChecks.length) {
                const described = failedChecks.map((name) => {
                  const split = splitChecks.find((s) => s.name === name);
                  // Say it out loud when the red is one of several runs sharing this name.
                  // "failing: verified-done gate" reads as "your diff is broken"; it may
                  // instead be a second trigger asserting something wider (BRO-2199).
                  return split
                    ? `${name} (${split.failedCount} of ${split.total} runs reporting under that name)`
                    : name;
                });
                return { action: "blocked-checks", reason: `failing: ${described.join(", ")}`, ...common };
              }

              if (missingChecks.length || cancelledChecks.length || pending) {
                // Absent is not the same as failing. A check that never appears is an
                // infrastructure fault (BRO-1863), and its signature is silence — so once
                // the window closes, say so out loud instead of waiting forever. A
                // CANCELLED run is the same class of non-answer (BRO-2370): it is silence
                // that happens to occupy a slot, so it waits and stalls like an absent one
                // rather than being reported as the author's red check.
                const noVerdict = [...missingChecks, ...cancelledChecks];
                const stalled =
                  noVerdict.length > 0 &&
                  labelAppliedAtMs !== null &&
                  nowMs - labelAppliedAtMs >= stallAfterMs;

                if (stalled) {
                  const hours = Math.round(stallAfterMs / 3600_000);
                  const parts = [
                    ...(missingChecks.length ? [`no run reported for ${missingChecks.join(", ")}`] : []),
                    ...(cancelledChecks.length ? [`${cancelledChecks.join(", ")} cancelled without a verdict (re-run required)`] : []),
                  ];
                  return { action: "stalled-checks", reason: `${parts.join("; ")} in ${hours}h`, ...common };
                }
                const waiting = [
                  ...missingChecks.map((c) => `${c} (no run yet)`),
                  ...cancelledChecks.map((c) => `${c} (cancelled — needs a re-run)`),
                  ...(pending ? [`${pending} still running`] : []),
                ];
                return { action: "wait-checks", reason: `waiting on ${waiting.join(", ")}`, ...common };
              }

              if (mergeable === false) return { action: "blocked-conflict", reason: "conflicts with base", ...common };
              if (mergeable === null) return { action: "wait-mergeability", reason: "mergeability not computed yet", ...common };

              return { action: "merge", reason: "all required checks green and mergeable", ...common };
            }
            // ---- END inlined merge-decision.js ---------------------------------

            // Either label arms the merge. They are never equivalent in the
            // record: the merge comment names which one authorized it.
            //   founder-approved — the Founder only. Agents prohibited.
            //   review-passed    — the CEO agent, on final review-gate approval,
            //                      when the Merge Gate Rubric is clear.
            const APPROVAL_LABELS = ['founder-approved', 'review-passed'];
            // The single job of layout-check.yml, which builds the Astro site, serves it,
            // and asserts no route scrolls horizontally at 375px. It runs on bare
            // `pull_request` — no branch filter, no `paths:`, no matrix, no job-level `if:`,
            // not continue-on-error — so every PR produces exactly one `layout` run. The
            // job has no `name:`, so the check-RUN name is the job id `layout`, NOT the
            // workflow name `Layout check`; verified against the check runs on PR #43
            // (88767ed), #42, and #41 rather than transcribed by eye.
            // `audit` is the single job of audit.yml (BRO-2205), which fails on a HIGH or
            // CRITICAL advisory against package-lock.json. Same shape as `layout`: bare
            // `pull_request`, no branch filter, no `paths:`, no matrix, no job-level `if:`,
            // not continue-on-error, and no `name:` — so the check-RUN name is the job id
            // `audit`. Verified against the check runs on PR #50, not transcribed by eye.
            // It was missing from this list from the day audit.yml landed (2026-08-19),
            // which is the BRO-2259 failure repeated: a workflow written to be a gate, real
            // in CI and decorative at the merge gate, so an armed PR merged on `layout`
            // alone while the advisory check was still running or already red.
            // The `CodeQL` / `Analyze (...)` runs on the same PRs stay excluded: they come
            // from GitHub's CodeQL default setup, configured in repo Settings rather than
            // in any checked-in YAML, so gating on them would depend on a toggle no commit
            // here can see (registry rule 6).
            // History: this entry was `[]` — label-alone merges — from BRO-2024 until
            // BRO-2182. layout-check.yml actually landed on 2026-08-11 with BRO-2027, five
            // days before anyone noticed the registry still said the repo had no PR CI.
            // That gap is why an empty `checks` array now demands a `noPrCiReason`.
            // This is also the repo from BRO-1890 where the Founder was told to apply
            // `founder-approved` to a workflow that did not exist.
            const REQUIRED_CHECKS = ['layout', 'audit'];
            // deploy.yml builds with withastro/action and publishes to GitHub Pages on
            // `push: [main]`. It already carries `workflow_dispatch:`, so the dispatch
            // works the moment this generation of the gate is installed.
            // audit.yml is `push: [main]` too and also already carries `workflow_dispatch:`.
            // It landed with BRO-2205 on 2026-08-19, after this entry was written, and was
            // never registered — audit.mjs has been reporting it as an unregistered dispatch
            // target since. Registered rather than exempted because its push-to-main run is
            // what establishes main's own advisory state; skipping it on every bot merge
            // leaves that state frozen at whatever the last human merge saw.
            const POST_MERGE_DISPATCH = {
              'main': ['deploy.yml', 'audit.yml'],
            };
            const MERGE_METHOD    = 'squash';
            const STALL_AFTER_MS  = 6 * 3600_000;
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            const getPr = async (n) =>
              (await github.rest.pulls.get({ owner, repo, pull_number: n })).data;

            // GitHub computes `mergeable` asynchronously; it is null until ready.
            async function pollMergeable(n) {
              let pr = await getPr(n);
              for (let i = 0; i < 6 && pr.mergeable === null; i++) {
                await sleep(3000);
                pr = await getPr(n);
              }
              return pr;
            }

            // Post a comment only if one carrying `marker` does not already exist,
            // so the 30-min sweep does not re-comment the same state every run.
            async function postOnce(n, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, per_page: 100,
              });
              if (comments.some((c) => (c.body || '').includes(marker))) return false;
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body: `${marker}\n${body}` });
              return true;
            }

            // Who applied the arming label + when. The actor is the audit trail
            // Eric's policy needs; the timestamp drives stall detection.
            async function labelEvent(n) {
              try {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: n, per_page: 100,
                });
                const labeled = events.filter(
                  (e) => e.event === 'labeled' && e.label && APPROVAL_LABELS.includes(e.label.name),
                );
                const last = labeled[labeled.length - 1];
                if (last) {
                  return {
                    actor: last.actor && last.actor.login ? last.actor.login : 'unknown',
                    at: last.created_at,
                    atMs: Date.parse(last.created_at),
                  };
                }
              } catch (e) {
                core.warning(`labelEvent lookup failed: ${e.message}`);
              }
              return { actor: 'unknown', at: null, atMs: null };
            }

            // BRO-2059. A merge performed here does not cascade into `on: push`
            // workflows, so anything that used to ride the push — a deploy, a
            // release, a cache warm — has to be asked for by name. Dispatch is
            // per BASE branch: a workflow listed under `staging` must never be
            // fired at `main`, because `createWorkflowDispatch` runs the file as
            // it exists on the ref it is given.
            //
            // A dispatch failure NEVER fails this run. The merge already
            // happened and cannot be undone; the useful thing left is to say so
            // loudly — in the PR comment and the run summary — rather than throw
            // and leave the merge looking unfinished.
            async function dispatchPostMerge(baseRef) {
              const workflows = POST_MERGE_DISPATCH[baseRef] || [];
              const outcomes = [];
              for (const workflow of workflows) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: workflow, ref: baseRef,
                  });
                  core.info(`post-merge: dispatched ${workflow} on ${baseRef}`);
                  outcomes.push({ workflow, ok: true, detail: `dispatched on \`${baseRef}\`` });
                } catch (e) {
                  // The two failures worth naming precisely, because both look
                  // identical from the PR ("no deploy ran") but need different fixes.
                  const detail = /workflow_dispatch/i.test(e.message)
                    ? `has no \`workflow_dispatch:\` trigger on \`${baseRef}\` — add one, or this can never be dispatched`
                    : e.status === 404
                      ? `does not exist on \`${baseRef}\` — fix the entry in repos.json`
                      : `dispatch failed: ${e.message}`;
                  core.warning(`post-merge: ${workflow} ${detail}`);
                  outcomes.push({ workflow, ok: false, detail });
                }
              }
              return outcomes;
            }

            async function attemptMerge(n, { verbose }) {
              const pr = await pollMergeable(n);
              const sha = pr.head.sha;
              // `filter: 'latest'` is the API default, pinned here on purpose:
              // resolveCheck's correctness depends on it (BRO-2199). Under
              // `latest` GitHub has already collapsed re-run attempts — a
              // re-run reports into the same check suite and replaces its
              // predecessor there — so every duplicate name the decision core
              // still sees is a SECOND TRIGGER, which it must not resolve by
              // clock. Switching this to 'all' would resurrect superseded reds
              // and hang every re-run recovery; don't, without reading that
              // function first.
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100, filter: 'latest',
              });
              const who = await labelEvent(n);

              const d = decideMerge({
                merged: !!pr.merged,
                state: pr.state,
                draft: !!pr.draft,
                mergeable: pr.mergeable,
                labels: (pr.labels || []).map((l) => l.name),
                checkRuns: checks.check_runs,
                approvalLabels: APPROVAL_LABELS,
                requiredChecks: REQUIRED_CHECKS,
                labelAppliedAtMs: who.atMs,
                nowMs: Date.now(),
                stallAfterMs: STALL_AFTER_MS,
              });

              core.info(`#${n}: ${d.action} — ${d.reason}`);

              // Never reaches pulls.merge: GitHub 405s a draft, and that throw is
              // what killed argus's sweep every 30 min (BRO-2200).
              if (d.action === 'wait-draft') {
                if (verbose) {
                  await postOnce(n, `<!-- merge-on-approval:draft:${n} -->`,
                    `⏳ \`${d.armedBy}\` is set, but this PR is still a **draft** — GitHub refuses to merge ` +
                    `a draft no matter who approved it. Click "Ready for review"; the label stays put and ` +
                    `the next sweep (within 30m) merges it once the required checks are green.`);
                }
                return { number: n, status: 'wait-draft' };
              }

              if (d.action === 'wait-checks') {
                if (verbose) {
                  await postOnce(n, `<!-- merge-on-approval:ci:${sha} -->`,
                    `⏳ \`${d.armedBy}\` is set, but not merging yet — ${d.reason}. ` +
                    `I'll merge automatically once every required check is green ` +
                    `(re-checked on the next push and on the scheduled sweep).`);
                }
                return { number: n, status: 'wait-checks' };
              }

              if (d.action === 'blocked-checks') {
                // BRO-2199/BRO-2024. When a required name reported more than
                // once on this commit, the runs came from different check
                // suites — a second trigger, or a second PR sharing this head
                // commit — and can legitimately assert different things: a push
                // run may cover the whole repo while the PR run covers the diff.
                // Say which run is red and link it, because from the approver's
                // side a bare "verified-done gate is red" is indistinguishable
                // from "your diff broke something".
                const split = (d.splitChecks || []).filter((s) => s.failedCount > 0);
                const splitNote = split.length
                  ? `\n\n> ⚠️ ${split.map((s) =>
                      `\`${s.name}\` reported **${s.total} times** on \`${sha.slice(0, 7)}\` and ` +
                      `${s.failedCount} of those runs is red` +
                      (s.failedUrls.length ? ` (${s.failedUrls.map((u) => `[red run](${u})`).join(', ')})` : '')
                    ).join('; ')}. ` +
                    `Runs sharing a name come from different triggers, or from another PR built on ` +
                    `this same commit — check whether the red one is actually about this diff ` +
                    `before pushing a fix.`
                  : '';
                await postOnce(n, `<!-- merge-on-approval:failed:${sha} -->`,
                  `❌ \`${d.armedBy}\` is set but CI is red — ${d.reason}. ` +
                  `Push a fix; the label stays and I'll merge once the checks go green.` +
                  splitNote);
                return { number: n, status: 'blocked-checks' };
              }

              // The BRO-1863 case. Silence looks identical to "still running"
              // until someone says otherwise — so say it, once, out loud.
              if (d.action === 'stalled-checks') {
                const tick = (c) => `\`${c}\``;
                const lines = [
                  ...(d.missingChecks.length
                    ? [`produced no run at all on \`${sha.slice(0, 7)}\`: ${d.missingChecks.map(tick).join(', ')}`]
                    : []),
                  ...(d.cancelledChecks.length
                    ? [`were **cancelled** without ever reporting a verdict: ${d.cancelledChecks.map(tick).join(', ')} — these need a re-run, not a fix`]
                    : []),
                ];
                await postOnce(n, `<!-- merge-on-approval:stalled:${sha} -->`,
                  `🚨 **CI never reported.** \`${d.armedBy}\` has been set for over ` +
                  `${Math.round(STALL_AFTER_MS / 3600_000)}h and these required checks ${lines.join('; and ')}.\n\n` +
                  `This is the signature of a workflow-scheduling failure, not a slow build — see BRO-1863, ` +
                  `where GitHub scheduled zero \`pull_request\` runs on this org and three PRs stalled silently. ` +
                  `Check whether the workflow is firing at all before assuming the PR is at fault.`);
                return { number: n, status: 'stalled-checks' };
              }

              if (d.action === 'blocked-conflict') {
                await postOnce(n, `<!-- merge-on-approval:conflict:${sha} -->`,
                  `⚠️ \`${d.armedBy}\` is set and CI is green, but this PR conflicts with \`${pr.base.ref}\` ` +
                  `and can't be merged automatically. Rebase/resolve — the label will merge it once mergeable.`);
                return { number: n, status: 'blocked-conflict' };
              }

              if (d.action === 'wait-mergeability') {
                if (verbose) {
                  await postOnce(n, `<!-- merge-on-approval:pending-mergeability:${sha} -->`,
                    `⏳ Armed and CI green, but GitHub is still computing mergeability. The sweep will retry shortly.`);
                }
                return { number: n, status: 'wait-mergeability' };
              }

              if (d.action !== 'merge') return { number: n, status: d.action };

              await github.rest.pulls.merge({ owner, repo, pull_number: n, merge_method: MERGE_METHOD });

              let branchDeleted = false;
              if (pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                  branchDeleted = true;
                } catch (e) {
                  core.warning(`branch delete failed for ${pr.head.ref}: ${e.message}`);
                }
              }

              const dispatched = await dispatchPostMerge(pr.base.ref);

              const authority = d.armedBy === 'founder-approved'
                ? 'the Founder personally authorized this merge'
                : 'agent review authority under the Merge Gate Rubric (CONTRIBUTING.md)';

              // A repo with no PR-time CI has an empty REQUIRED_CHECKS. Say so
              // explicitly rather than rendering an empty "Gates:" line that
              // reads like the checks passed (BRO-2024).
              const gates = REQUIRED_CHECKS.length
                ? `${REQUIRED_CHECKS.map((c) => `\`${c}\``).join(', ')} — all success on \`${sha.slice(0, 7)}\``
                : `**none configured in this repo** — the label alone authorized this merge`;

              // Say what did or did not get kicked off. A bot merge cannot
              // cascade into `on: push`, so "nothing configured" is a real and
              // reportable state, not an empty line (BRO-2059).
              const postMerge = dispatched.length
                ? dispatched.map((r) => `${r.ok ? '✅' : '⚠️'} \`${r.workflow}\` ${r.detail}`).join('; ')
                : `**nothing configured for \`${pr.base.ref}\`** — a bot merge does not trigger ` +
                  `\`on: push\` workflows, so no deploy ran as a result of this merge`;

              await github.rest.issues.createComment({ owner, repo, issue_number: n, body:
                `<!-- merge-on-approval:merged:${sha} -->\n` +
                `✅ Merged by **merge-on-approval** (\`${MERGE_METHOD}\`).\n\n` +
                `- Authorized by: \`${d.armedBy}\` — ${authority}\n` +
                `- Applied by: **@${who.actor}**${who.at ? ` at ${who.at}` : ''}\n` +
                `- Gates: ${gates}\n` +
                `- Branch \`${pr.head.ref}\`: ${branchDeleted ? 'deleted' : 'left in place'}\n` +
                `- Post-merge: ${postMerge}\n\n` +
                `_Audit: \`founder-approved\` may only ever be applied by the Founder; agents applying it is an ` +
                `audit failure. \`review-passed\` is agent-appliable but forbidden on hard-stop rubric categories._`,
              });
              return { number: n, status: 'merged', actor: who.actor, armedBy: d.armedBy, dispatched };
            }

            const event = context.eventName;
            const results = [];

            if (event === 'pull_request_target') {
              const action = context.payload.action;
              const pr = context.payload.pull_request;
              if (action === 'labeled') {
                if (context.payload.label && APPROVAL_LABELS.includes(context.payload.label.name)) {
                  results.push(await attemptMerge(pr.number, { verbose: true }));
                } else {
                  core.info(`Ignoring 'labeled' for "${context.payload.label && context.payload.label.name}".`);
                }
              } else if (action === 'synchronize') {
                const full = await getPr(pr.number);
                const present = (full.labels || []).map((l) => l.name).filter((n) => APPROVAL_LABELS.includes(n));
                if (present.length) {
                  for (const name of present) {
                    await github.rest.issues
                      .removeLabel({ owner, repo, issue_number: pr.number, name })
                      .catch((e) => core.warning(`removeLabel(${name}) failed: ${e.message}`));
                  }
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
                    `<!-- merge-on-approval:label-stripped:${full.head.sha} -->\n` +
                    `🔄 New commits pushed after approval — removed ${present.map((n) => `\`${n}\``).join(', ')}. ` +
                    `Re-apply once CI is green on the new commit to merge the updated PR.` });
                  results.push({ number: pr.number, status: 'label-stripped' });
                }
              }
            } else if (event === 'schedule' || event === 'workflow_dispatch' || event === 'workflow_run') {
              // BRO-2426. `workflow_run` routes down the SAME sweep path rather
              // than targeting the triggering PR, on purpose. The event does
              // carry `workflow_run.pull_requests[]`, but that array is empty
              // for fork PRs and unreliable in general — and precision buys
              // nothing here. The sweep is one `pulls.list` plus real work only
              // for PRs carrying an arming label, which is usually zero or one,
              // and it is naturally idempotent. Routing to a second code path
              // to save one API call would double the surface that can break.
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              const labeled = prs.filter((p) => (p.labels || []).some((l) => APPROVAL_LABELS.includes(l.name)));
              const trigger = event === 'workflow_run' && context.payload.workflow_run
                ? ` (triggered by \`${context.payload.workflow_run.name}\` → ${context.payload.workflow_run.conclusion})`
                : '';
              core.info(`Sweep${trigger}: ${labeled.length} open PR(s) carrying ${APPROVAL_LABELS.join(' or ')}.`);
              for (const p of labeled) {
                // The sweep is the BACKSTOP — it is the only thing that retries a
                // PR labeled while CI was still running, and it must therefore
                // survive any single PR (BRO-2370). It did not: argus #264 edits
                // `.github/workflows/`, which GITHUB_TOKEN is categorically
                // forbidden to merge ("refusing to allow a GitHub App to create or
                // update workflow ... without `workflows` permission"). That 403
                // threw out of the loop and killed the whole step, so every PR
                // after it was never evaluated and #168 sat labeled-and-green for
                // 5 weeks. One un-mergeable PR silently disarmed the gate for the
                // entire repo — the exact inertness this workflow exists to fix.
                try {
                  results.push(await attemptMerge(p.number, { verbose: event === 'workflow_dispatch' }));
                } catch (e) {
                  core.warning(`#${p.number}: ${e.message}`);
                  // The Founder does not read Action logs, so the explanation goes
                  // where the decision is made. The workflow-file case is called out
                  // by name because it is permanent: no token this workflow can hold
                  // will ever merge that PR, so "wait for the sweep" is wrong advice.
                  const isWorkflowPerm = /without `?workflows`? permission/.test(e.message || '');
                  await postOnce(p.number, `<!-- merge-on-approval:errored:${p.head.sha} -->`,
                    isWorkflowPerm
                      ? `🔒 **This PR has to be merged by a human.** It edits files under ` +
                        `\`.github/workflows/\`, and GitHub categorically refuses to let a ` +
                        `GitHub App token merge those — the arming label cannot override it. ` +
                        `Merge it from the GitHub UI; the gate will not retry.`
                      : `💥 **The merge gate errored on this PR** and swept past it: \`${e.message}\`. ` +
                        `The label stays; the sweep retries in 30m. If this repeats, it needs a human.`,
                  ).catch((err) => core.warning(`comment on #${p.number} failed: ${err.message}`));
                  results.push({ number: p.number, status: 'errored', error: e.message });
                }
              }
            }

            // Digest → run summary (audit surface; no comment spam).
            const merged   = results.filter((r) => r.status === 'merged');
            const awaiting = results.filter((r) => ['wait-checks', 'wait-mergeability'].includes(r.status));
            const redCI    = results.filter((r) => r.status === 'blocked-checks');
            const stalled  = results.filter((r) => r.status === 'stalled-checks');
            const blocked  = results.filter((r) => r.status === 'blocked-conflict');
            const stripped = results.filter((r) => r.status === 'label-stripped');
            const drafts   = results.filter((r) => r.status === 'wait-draft');
            const errored  = results.filter((r) => r.status === 'errored');
            // A merge that shipped nothing is the BRO-2059 failure. It is not an
            // error in this run, so it gets its own row rather than a red X.
            const noDeploy = merged.filter((r) => (r.dispatched || []).some((x) => !x.ok));
            const fmt = (arr) => (arr.length ? arr.map((r) => `#${r.number}`).join(', ') : '—');
            await core.summary
              .addHeading(`merge-on-approval · ${event}`)
              .addTable([
                [{ data: 'Outcome', header: true }, { data: 'PRs', header: true }],
                ['✅ Merged', fmt(merged)],
                ['⏳ Awaiting CI / mergeability', fmt(awaiting)],
                ['❌ CI red', fmt(redCI)],
                ['🚨 CI never reported', fmt(stalled)],
                ['⚠️ Blocked (conflict)', fmt(blocked)],
                ['📝 Armed but still a draft', fmt(drafts)],
                ['🔄 Label stripped (new push)', fmt(stripped)],
                ['🚀 Post-merge dispatch failed', fmt(noDeploy)],
                ['💥 Errored (swept past)', fmt(errored)],
              ])
              .write();

            // Surface errors AFTER every PR has had its turn. Failing the step is
            // right — an errored PR needs a human — but it must not be what stops
            // the other PRs from being swept (BRO-2370).
            if (errored.length) {
              core.setFailed(
                `Sweep completed, but these PRs errored and were skipped: ` +
                errored.map((r) => `#${r.number} (${r.error})`).join('; '),
              );
            }

            if (merged.length) core.notice(`Merged: ${merged.map((r) => `#${r.number}`).join(', ')}`);
            if (noDeploy.length) {
              core.warning(
                `Merged but nothing was deployed for: ${noDeploy.map((r) => `#${r.number}`).join(', ')}. ` +
                `A bot merge cannot trigger \`on: push\` workflows (BRO-2059) — see the PR comment for which ` +
                `dispatch failed and why.`,
              );
            }
